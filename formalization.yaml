    relationship: "adapts"
    note: >-
      The decomposition of good interval representations follows the route of
      the linear-quiver decomposition there; no module is copied (see
      VENDORED.md).

status:
  scope: >-
    Theorem A (with the nonembedding into triangulated categories in all
    universes), Theorem B, the necessity part of Theorem B for triangulated
    targets in all universes, Proposition 2.3, Corollary 2.4, Proposition 4.4
    and Proposition 4.6, as stated in the paper, for an arbitrary field. The
    compared statements in Challenge.lean use only Mathlib definitions. Every
    numbered statement of the paper is covered in docs/PAPER-CORRESPONDENCE.md;
    Example 4.2 is proved in the library but not compared. Proposition 4.4 is
    compared with E² = 0; the vanishing of the higher Eⁿ is not stated.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        An AI coding agent working in a local Lean project with compiler
        feedback, explicit axiom audits and a statement-by-statement
        correspondence with the paper, under the author's direction.
      cost:
        wall_time: "About two days of development (November 21–22, 2026)"
        spend_usd: "subscription-based"
        hardware: "Local Linux workstation"
      prompting_notes: >-
        The author required the whole paper and its cited inputs to be proved,
        with Mathlib as the only dependency, organized by mathematics, and
        allowed proof routes that differ from the paper.
  spend_usd: "subscription-based"
  notes: >-
    The paper was developed and written with AI models under the author's
    direction (see PROVENANCE.md). The formalization was written by an AI
    coding agent under the author's direction.

fidelity:
  divergences: >-
    The statements are those of the paper. The extension bifunctor of C(D) is
    Ext¹ computed in the category of all representations of I with a new least
    point, which the paper identifies with Ext¹ in B_J in the proof of Corollary
    2.4. Algebraic triangulated categories are described by a full, essentially
    surjective functor from a Frobenius exact category killing exactly the
    morphisms through projective-injectives, with natural connecting morphisms
    giving distinguished triangles; this is equivalent to a triangle equivalence
    with the stable category. Heredity is E² = 0 for the tensor square of
    Gorsky, Nakaoka and Palu, given by generators and relations. The
    triangulated targets of the realization statements (Theorem A(2), Theorem B,
    Proposition 2.3, Corollary 2.4, Proposition 4.6) have objects in the
    universe of C(D); the nonembedding statements quantify over all universes.
    Intermediate results that follow a different route are listed in
    docs/proofs. No weakening of the hypotheses or conclusions is known.

review:
  status: "unreviewed"
  notes: >-
    The statements and proofs have not been reviewed by a human expert or by an
    independent agent audit.

