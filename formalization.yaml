    authors: ["M. Gorsky", "H. Nakaoka", "Y. Palu"]
    type: "paper"
    location: "Math. Z. 313 (2026), article 89"
    relationship: "background"
    note: >-
      Poses the question answered by Theorem A; the tensor square E ⊗ E of
      Definition 3.1 there is stated in Statement.lean for heredity.
    author_endorsement: "not-contacted"
  - title: "Extriangulated categories, Hovey twin cotorsion pairs and model structures"
    authors: ["H. Nakaoka", "Y. Palu"]
    type: "paper"
    location: "Cah. Topol. Géom. Différ. Catég. 60 (2019), no. 2, 117–193"
    relationship: "background"
    note: >-
      Definition 2.12 (extriangulated categories) is stated in Statement.lean;
      Proposition 3.24, in the direction used, is proved in the library.
    author_endorsement: "not-contacted"
  - title: "Transport of structure in higher homological algebra"
    authors: ["R. Bennett-Tennenhaus", "A. Shah"]
    type: "paper"
    location: "J. Algebra 574 (2021), 514–549"
    relationship: "background"
    note: >-
      Definition 2.32 (extriangulated functors, n = 1) is stated in
      Statement.lean.
    author_endorsement: "not-contacted"
  - title: "Every module is an inverse limit of injectives"
    authors: ["G. M. Bergman"]
    type: "paper"
    location: "Proc. Amer. Math. Soc. 141 (2013), no. 4, 1177–1183"
    relationship: "background"
    note: >-
      Lemma 3 there (after Higman and Stone) is the paper's Lemma 4.1, proved in
      the library by a finite-support argument.
    author_endorsement: "not-contacted"
  - title: "Set Theory, third millennium edition"
    authors: ["T. Jech"]
    type: "book"
    location: "Springer-Verlag, Berlin, 2003"
    relationship: "background"
    note: >-
      The Aronszajn tree of the proof of Theorem 9.16 there is the paper's
      Construction 4.3, constructed in the library.
    author_endorsement: "not-contacted"
  - title: "Krull–Schmidt categories and projective covers"
    authors: ["H. Krause"]
    type: "paper"
    location: "Expo. Math. 33 (2015), no. 4, 535–549"
    relationship: "background"
    note: >-
      Corollary 4.4 there is used by the paper for idempotent completeness; the
      library replaces it by a direct splitting argument.
    author_endorsement: "not-contacted"

related_formalizations:
