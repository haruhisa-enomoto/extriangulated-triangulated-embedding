    relationship: "formalizes"
    note: >-
      The formalized paper, developed under the author's direction with
      GPT-6.2 Astra, reviewed with Claude Opus 5.5 and polished with Gemini 4
      Neon. Statements are matched with Lean declarations in
      docs/PAPER-CORRESPONDENCE.md.
    author_endorsement: "participated"
