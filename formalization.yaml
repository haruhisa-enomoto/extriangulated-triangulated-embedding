# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "An extriangulated category with no triangulated embedding"
  description: >-
    A Lean 4 formalization, built on Mathlib, of the paper An extriangulated
    category with no triangulated embedding. Over every field k there is an
    essentially small k-linear extriangulated category with no triangulated
    embedding into a triangulated category in any universe, whose countable
    families of objects lie in extension-closed subcategories with algebraic
    realizations, and which is hereditary and Krull–Schmidt, has enough
    injectives and ℵ₁ isomorphism classes of indecomposables with endomorphism
    ring k, extension spaces of dimension at most one between indecomposables,
    and morphism spaces of countable dimension (Theorem A). It is the category
    C(D) attached to an inverse system D of vector spaces with surjective
    transition maps over an ordinal; C(D) has a triangulated embedding iff every
    projection lim D → D_i is surjective iff it has an algebraic realization
    (Theorem B). The library also proves Propositions 2.3, 4.4 and 4.6,
    Corollary 2.4, Example 4.2, Jech's Aronszajn tree and Bergman's lemma on
    linearized inverse limits.
  authors: ["Haruhisa Enomoto"]
  responsible_maintainers: ["Haruhisa Enomoto"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.CT", "math.RT", "math.LO"]
  msc2020: ["18G80", "18G25", "18E05", "03E05"]

