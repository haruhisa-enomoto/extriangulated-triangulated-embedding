name = "extriangulated_realization"
version = "0.1.0"
defaultTargets = ["ExtriangulatedRealization"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "2ddf59c8f14245864e6c0ed227a2dab76b9efea2"

[[lean_lib]]
name = "ExtriangulatedRealization"
globs = ["ExtriangulatedRealization", "ExtriangulatedRealization.*"]
weakLeanArgs = ["-j1", "-M14000"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]
weakLeanArgs = ["-j1", "-M14000"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
weakLeanArgs = ["-j1", "-M14000"]
